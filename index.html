<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>BEAT 91</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-weight:900;letter-spacing:3px;font-size:26px}.target{text-align:right;font-size:11px;color:#9badc2}.target b{display:block;color:#fff;font-size:17px}.card{background:#0d1b2d;border:1px solid #20324a;border-radius:18px;padding:18px;margin-bottom:14px}.hero{text-align:center;padding:28px 18px;background:linear-gradient(145deg,#102640,#0b1625)}h1{font-size:34px;margin:0 0 8px}.muted{color:#93a4bb}.small{font-size:12px}.pill{display:inline-block;border:1px solid #334a67;border-radius:999px;padding:5px 9px;font-size:11px;margin:3px}.btn{border:0;border-radius:13px;padding:14px 18px;background:#fff;color:#07111f;font-weight:800;font-size:15px;cursor:pointer;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{cursor:pointer;text-align:left;background:#111f32;border:1px solid #2b405c;border-radius:15px;padding:14px;color:#fff;min-height:150px}.name{font-size:16px;font-weight:800}.meta{font-size:11px;color:#91a5bd;margin-top:7px}.score{font-size:28px;font-weight:900;margin-top:12px}.attr{font-size:11px;color:#b8c7d8}.status{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#101f33;border-radius:12px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:#8fa3bb}.row{display:flex;justify-content:space-between;padding:9px 11px;background:#101f33;border-radius:9px;font-size:12px;margin:5px 0}.hidden{display:none}.result{text-align:center}.big{font-size:64px;font-weight:950}.win{font-size:22px;font-weight:900;margin:10px 0}@media(max-width:560px){.grid{grid-template-columns:1fr}.choice{min-height:auto}}</style></head>
<body><main class="app"><div class="top"><div class="logo">BEAT 91</div><div class="target">TARGET<b>91 GOALS</b>MESSI · 2012</div></div>
<section id="home" class="card hero"><h1>Build the striker.</h1><p class="muted">7 özellik seç. 60 maç oyna. 91'i geç.</p><p><span class="pill">6,365 PLAYERS</span><span class="pill">7 ATTRIBUTES</span><span class="pill">60 MATCHES</span></p><button class="btn" onclick="startGame()">START RUN</button></section>
<section id="game" class="hidden"><div class="card"><div class="status"><div class="stat"><b id="round">1/7</b><span>ATTRIBUTE</span></div><div class="stat"><b id="picked">0</b><span>PLAYERS</span></div><div class="stat"><b id="liveGoals">0</b><span>GOALS</span></div></div></div>
<div class="card"><h2 id="attrTitle"></h2><p class="muted small">Birini seç. Seçilen oyuncu bu koşu boyunca tekrar kullanılamaz.</p><div id="choices" class="grid"></div></div><div class="card"><h2>Your striker</h2><div id="build"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div class="muted">FINAL SCORE</div><div class="big" id="finalScore"></div><div class="win" id="resultText"></div><p class="muted">Target: 91 goals · 60 matches</p><button class="btn" onclick="startGame()">PLAY AGAIN</button></div><div class="card"><h2>Run summary</h2><div id="summary"></div></div></section></main>
<script>
let players=[],state;const attrs=["Right Foot","Left Foot","Heading","Mind","Free Kick","Penalty","Speed"];
async function boot(){players=await(await fetch("data/players.json")).json();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}
function startGame(){state={round:0,used:new Set(),picks:[],goals:0};home.classList.add("hidden");result.classList.add("hidden");game.classList.remove("hidden");render()}
function sample(){let p=players.filter(x=>!state.used.has(x.id)),o=[];while(o.length<3&&p.length){let x=p[Math.floor(Math.random()*p.length)];if(!o.some(y=>y.id===x.id))o.push(x)}return o}
function render(){let a=attrs[state.round];round.textContent=`${state.round+1}/7`;picked.textContent=state.picks.length;liveGoals.textContent=state.goals;attrTitle.textContent=a;choices.innerHTML="";sample().forEach(p=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<div class="name">${esc(p.name)}</div><div class="meta">${esc(p.role)} · ${p.apps} WC apps · ${p.goals} WC goals</div><div class="score">${p.ratings[a]}</div><div class="attr">${a}</div>`;b.onclick=()=>choose(p,a);choices.appendChild(b)});build.innerHTML=state.picks.length?state.picks.map(x=>`<div class="row"><span>${x.a} — ${esc(x.p.name)}</span><b>${x.p.ratings[x.a]}</b></div>`).join(""):"<div class='muted small'>No attributes selected yet.</div>"}
function choose(p,a){state.used.add(p.id);state.picks.push({a,p});if(state.round<6){state.round++;render()}else simulate()}
function simulate(){let avg=1.05+(state.picks.reduce((s,x)=>s+x.p.ratings[x.a],0)/7-65)*.16;state.goals=0;for(let i=0;i<60;i++){let lam=Math.max(.05,avg*(.72+Math.random()*.56));state.goals+=poisson(lam)};game.classList.add("hidden");result.classList.remove("hidden");finalScore.textContent=state.goals;resultText.textContent=state.goals>91?"YOU BEAT 91.":state.goals===91?"YOU TIED 91.":"91 WINS THIS RUN.";summary.innerHTML=state.picks.map(x=>`<div class="row"><span>${x.a} · ${esc(x.p.name)}</span><b>${x.p.ratings[x.a]}</b></div>`).join("")+`<div class="row"><span>60 MATCHES</span><b>${state.goals} GOALS</b></div>`}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}boot();
</script></body></html>
